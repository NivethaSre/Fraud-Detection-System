<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Detection EDA Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #ff8a80;
            --primary-light: #ffbcaf;
            --primary-dark: #c85a54;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animated Background */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 138, 128, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 188, 175, 0.1) 0%, transparent 40%);
        }

        /* Layout */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            color: var(--primary);
            width: 32px;
            height: 32px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .refresh-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: var(--primary);
            color: var(--bg-dark);
            border-color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: var(--primary);
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--primary);
            opacity: 0.5;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 2rem;
        }

        .chart-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .col-6 {
            grid-column: span 6;
        }

        .col-12 {
            grid-column: span 12;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .chart-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--glass);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* WordCloud Styling */
        .wordcloud-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .wc-image-container {
            text-align: center;
            flex: 1;
            min-width: 300px;
        }

        .wc-image {
            width: 100%;
            border-radius: 12px;
            margin-top: 0.5rem;
            border: 1px solid var(--glass-border);
        }

        @media (max-width: 992px) {
            .col-6 {
                grid-column: span 12;
            }
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>

    <div class="container">
        <header>
            <div class="logo-area">
                <i data-lucide="bar-chart-3" class="logo-icon"></i>
                <h1>Fraud Detection EDA Dashboard</h1>
            </div>
            <div class="header-actions">
                <button class="refresh-btn" onclick="refreshDashboard()">
                    <i data-lucide="refresh-cw" size="16"></i>
                    Refresh Data
                </button>
                <div id="last-updated" style="color: var(--text-dim); font-size: 0.8rem;"></div>
            </div>
        </header>

        <div class="stats-grid" id="stats-container">
            <!-- Stats loaded via JS -->
        </div>

        <div class="dashboard-grid">
            <!-- Chart 1: Fraud Distribution -->
            <div class="chart-container col-6">
                <div class="chart-header">
                    <span class="chart-title">Fraud Label Distribution</span>
                    <i data-lucide="pie-chart" size="18" color="#ff8a80"></i>
                </div>
                <div class="chart-area">
                    <img src="/static/charts/1_fraud_distribution.png" class="wc-image" alt="Fraud Distribution">
                </div>
            </div>

            <!-- Chart 2: Correlation Heatmap -->
            <div class="chart-container col-6">
                <div class="chart-header">
                    <span class="chart-title">Correlation Heatmap</span>
                    <i data-lucide="grid" size="18" color="#ff8a80"></i>
                </div>
                <div class="chart-area">
                    <img src="/static/charts/2_correlation_heatmap.png" class="wc-image" alt="Correlation Heatmap">
                </div>
            </div>

            <!-- Chart 3: Fraud by Category -->
            <div class="chart-container col-12">
                <div class="chart-header">
                    <span class="chart-title">Fraud Distribution by Category</span>
                    <i data-lucide="layers" size="18" color="#ff8a80"></i>
                </div>
                <div class="chart-area">
                    <img src="/static/charts/3_fraud_by_category.png" class="wc-image" alt="Fraud by Category">
                </div>
            </div>

            <!-- Chart 4: Word Cloud -->
            <div class="chart-container col-12">
                <div class="chart-header">
                    <span class="chart-title">Text Content Analysis (Word Clouds)</span>
                    <i data-lucide="type" size="18" color="#ff8a80"></i>
                </div>
                <div class="chart-area">
                    <img src="/static/charts/4_wordcloud_comparison.png" class="wc-image" alt="WordCloud Comparison">
                </div>
            </div>

            <!-- Chart 5: Description Length -->
            <div class="chart-container col-12">
                <div class="chart-header">
                    <span class="chart-title">Description Length Analysis</span>
                    <i data-lucide="ruler" size="18" color="#ff8a80"></i>
                </div>
                <div class="chart-area">
                    <img src="/static/charts/5_description_length_analysis.png" class="wc-image"
                        alt="Description Length Analysis">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Fetch Stats
        async function fetchStats() {
            try {
                const response = await fetch('/api/summary');
                const data = await response.json();

                const container = document.getElementById('stats-container');
                container.innerHTML = `
                    <div class="stat-card">
                        <span class="stat-label">Total Records</span>
                        <span class="stat-value">${data.total_records.toLocaleString()}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Fraudulent Claims</span>
                        <span class="stat-value" style="color: var(--accent-red)">${data.fraud_count}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Legitimate Claims</span>
                        <span class="stat-value" style="color: var(--accent-green)">${data.legitimate_count}</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Fraud Rate</span>
                        <span class="stat-value">${data.fraud_rate}%</span>
                    </div>
                `;

                document.getElementById('last-updated').innerText = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error('Error fetching stats:', error);
            }
        }

        function refreshDashboard() {
            fetchStats();
            // Images reload automatically on page refresh, or we could append a query string to force reload if needed
            // For now, just refreshing stats is enough as images are static files.
        }

        // Initialize dashboard
        window.addEventListener('load', fetchStats);
    </script>
</body>

</html>
